name: Deploy Staging to Vercel

on:
  push:
    branches:
      - staging

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

  deploy-staging:
    needs: [unit-test, e2e-test]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=preview --git-branch=staging --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Vercel staging API environment variable
        run: test -s .vercel/.env.preview.local && grep -q '^VITE_API_BASE_URL=' .vercel/.env.preview.local

      - name: Build Project Artifacts
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel Staging
        id: deploy
        run: |
          deployment_url="$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} | tail -n 1)"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Prepare integration test environment
        run: |
          api_base_url="$(node -e "const fs = require('fs'); const line = fs.readFileSync('.vercel/.env.preview.local', 'utf8').split(/\r?\n/).find((item) => item.startsWith('VITE_API_BASE_URL=')); if (!line) process.exit(1); console.log(line.slice(line.indexOf('=') + 1).replace(/^['\"]|['\"]$/g, ''))")"
          echo "INTEGRATION_FRONTEND_URL=${{ steps.deploy.outputs.url }}" >> "$GITHUB_ENV"
          echo "INTEGRATION_API_BASE_URL=$api_base_url" >> "$GITHUB_ENV"

      - name: Run frontend/backend integration tests
        run: npm run test:integration

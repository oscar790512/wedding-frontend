name: Deploy Production to Vercel

on:
  push:
    branches:
      - main

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run unit tests
        run: npm test

  e2e-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e

  deploy-production:
    needs: [unit-test, e2e-test]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel Production
        id: deploy
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} | tee vercel-deploy-output.txt
          deployment_url="$(grep -Eo 'https://[^[:space:]]+' vercel-deploy-output.txt | grep -v '^https://vercel.com/' | tail -n 1)"
          test -n "$deployment_url"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Prepare integration test environment
        run: |
          api_base_url="$(node -e "const fs = require('fs'); const line = fs.readFileSync('.vercel/.env.production.local', 'utf8').split(/\r?\n/).find((item) => item.startsWith('VITE_API_BASE_URL=')); if (!line) process.exit(1); console.log(line.slice(line.indexOf('=') + 1).replace(/^['\"]|['\"]$/g, ''))")"
          echo "INTEGRATION_FRONTEND_URL=${{ steps.deploy.outputs.url }}" >> "$GITHUB_ENV"
          echo "INTEGRATION_API_BASE_URL=$api_base_url" >> "$GITHUB_ENV"

      - name: Run frontend/backend integration tests
        run: npm run test:integration
